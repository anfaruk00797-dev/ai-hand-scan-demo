<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HandClean Station</title>
<style>
:root{
 --ink:#14303a;--ink-soft:#4f6b74;--glass:#ffffffd9;--glass-line:#ffffff;
 --mint:#14b8a6;--mint-soft:#ccfbf1;--holo:#5eead4;
 --clean:#16a34a;--clean-bg:#f0fdf4;--dirty:#ea580c;--dirty-bg:#fff7ed;
 --fade:.42s cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1418;font-family:"Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#screen{width:100%;height:100%;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,177.86vh);aspect-ratio:1366/768;overflow:hidden;container-type:inline-size;background:#eef6f6}

/* ---------- Background layers: only these swap between Home and live scan ---------- */
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity var(--fade),filter var(--fade),transform var(--fade)}
#tutorial{opacity:1}
#live{opacity:0;background:radial-gradient(ellipse at 50% 55%,#ffffff 0%,#e6f4f3 55%,#d3e9e8 100%)}
#stage:not([data-state="home"]) #tutorial{opacity:0;filter:blur(14px);transform:scale(1.04)}
#stage:not([data-state="home"]) #live{opacity:1}
#stage[data-state="detecting"] #tutorial{opacity:.55;filter:blur(6px);transform:scale(1.015)}
#stage[data-state="detecting"] #live{opacity:.45}
#live img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#live svg{position:absolute;left:50%;top:54%;width:38cqw;transform:translate(-50%,-50%)}
.hand{fill:none;stroke:var(--mint);stroke-width:1.4;stroke-linejoin:round;opacity:.55;transition:transform .7s cubic-bezier(.65,0,.35,1)}
#stage[data-side="2"] .hand{transform:scaleX(-1);transform-origin:50% 50%}
.grid line{stroke:var(--holo);stroke-width:.35;opacity:.35}
.sweep{fill:url(#sweepGrad);opacity:0}
#stage[data-state="scan1"] .sweep,#stage[data-state="scan2"] .sweep{opacity:1;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(0)}to{transform:translateY(118px)}}

/* ---------- Shared top bar: identical position in every state ---------- */
#topbar{position:absolute;top:2.6%;left:2.6%;right:2.6%;display:flex;align-items:center;gap:1.4cqw;pointer-events:none}
.brand{display:flex;align-items:center;gap:.6cqw;font-size:1.25cqw;font-weight:700;color:var(--ink);padding:.7cqw 1.1cqw;border-radius:999px;background:var(--glass);box-shadow:0 2px 14px #0f2f3a14;backdrop-filter:blur(10px)}
.brand i{width:1cqw;height:1cqw;border-radius:50%;background:var(--mint);box-shadow:0 0 0 .3cqw var(--mint-soft)}
#steps{flex:1;display:flex;justify-content:center;gap:.4cqw;margin:0;padding:.55cqw;list-style:none;border-radius:999px;background:var(--glass);box-shadow:0 2px 14px #0f2f3a14;backdrop-filter:blur(10px)}
#steps li{display:flex;align-items:center;gap:.55cqw;padding:.45cqw 1cqw .45cqw .5cqw;border-radius:999px;font-size:1.2cqw;font-weight:600;color:#7c959c;transition:background .3s,color .3s}
#steps b{display:grid;place-items:center;width:2cqw;height:2cqw;border-radius:50%;background:#e2ecee;color:#6b8790;font-size:1.05cqw;transition:background .3s,color .3s}
#steps li.done{color:var(--ink-soft)}
#steps li.done b{background:var(--mint-soft);color:#0f766e;font-size:0}
#steps li.done b:after{content:"✓";font-size:1.05cqw}
#steps li.active{background:var(--mint);color:#fff}
#steps li.active b{background:#fff;color:var(--mint)}
#mode{font-size:1.05cqw;font-weight:600;padding:.75cqw 1.1cqw;border-radius:999px;background:var(--glass);color:var(--ink-soft);box-shadow:0 2px 14px #0f2f3a14;white-space:nowrap}
#mode.live{background:var(--ink);color:#fff}
#mode.live:before{content:"";display:inline-block;width:.7cqw;height:.7cqw;margin-right:.5cqw;border-radius:50%;background:var(--holo);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- Home call to action ---------- */
#cta{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);text-align:center;transition:opacity var(--fade),transform var(--fade)}
#cta strong{display:inline-block;font-size:2.3cqw;padding:1.1cqw 2.6cqw;border-radius:999px;background:var(--ink);color:#fff;box-shadow:0 8px 28px #0f2f3a40}
#cta p{margin:.8cqw 0 0;font-size:1.2cqw;font-weight:600;color:#fff;text-shadow:0 1px 6px #0008}
#stage:not([data-state="home"]) #cta{opacity:0;transform:translate(-50%,1.5cqw);pointer-events:none}

/* ---------- Live instruction + progress ---------- */
#live-ui{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:1cqw;opacity:0;transition:opacity var(--fade)}
#stage:not([data-state="home"]):not([data-state="result"]) #live-ui{opacity:1}
#instruction{font-size:3.6cqw;font-weight:700;margin:0;color:var(--ink);text-align:center}
#sub{font-size:1.6cqw;font-weight:600;margin:0;color:var(--ink-soft)}
#meter{width:34cqw;height:1cqw;border-radius:99px;background:#d6e6e8;overflow:hidden}
#meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--holo),var(--mint));border-radius:inherit;transition:width .25s linear}
#stage[data-state="flip"] #instruction{animation:nudge 1.2s ease-in-out infinite}
#stage[data-state="flip"] #meter,#stage[data-state="detecting"] #meter{visibility:hidden}
@keyframes nudge{50%{transform:scale(1.04)}}
#warn{position:absolute;top:14%;left:50%;transform:translateX(-50%);padding:.9cqw 2cqw;border-radius:999px;background:var(--dirty);color:#fff;font-size:1.8cqw;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#warn.show{opacity:1}

/* ---------- Result: readable from where the user stands ---------- */
#result{position:absolute;inset:12% 18% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;border-radius:2.4cqw;background:var(--clean-bg);box-shadow:0 20px 60px #0f2f3a30;opacity:0;transform:scale(.94);transition:opacity var(--fade),transform var(--fade);pointer-events:none}
#stage[data-state="result"] #result{opacity:1;transform:none}
#result .icon{display:grid;place-items:center;width:12cqw;height:12cqw;border-radius:50%;background:var(--clean);color:#fff;font-size:7cqw;line-height:1}
#result h2{margin:0;font-size:8cqw;line-height:1.1;color:var(--clean)}
#result p{margin:0;font-size:2.1cqw;font-weight:600;color:var(--ink)}
#result small{font-size:1.3cqw;color:var(--ink-soft)}
#result.dirty{background:var(--dirty-bg)}
#result.dirty .icon{background:var(--dirty)}
#result.dirty h2{color:var(--dirty)}

#hint{position:absolute;right:1%;bottom:1%;font-size:.8cqw;color:#ffffffaa;text-shadow:0 1px 3px #000;pointer-events:none}
#hint:empty{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="screen">
 <div id="stage" data-state="home" data-side="1">
  <video id="tutorial" class="layer" muted loop autoplay playsinline preload="auto"></video>
  <div id="live" class="layer" aria-hidden="true">
   <img id="feed" alt="" hidden>
   <svg viewBox="0 0 200 200">
    <defs><linearGradient id="sweepGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#5eead4" stop-opacity=".55"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient></defs>
    <g class="grid"><line x1="20" x2="180" y1="40" y2="40"/><line x1="20" x2="180" y1="80" y2="80"/><line x1="20" x2="180" y1="120" y2="120"/><line x1="20" x2="180" y1="160" y2="160"/><line y1="20" y2="180" x1="60" x2="60"/><line y1="20" y2="180" x1="100" x2="100"/><line y1="20" y2="180" x1="140" x2="140"/></g>
    <path class="hand" d="M70 182 C62 150 52 128 40 108 C34 98 44 90 52 98 L70 120 L66 44 C66 34 80 34 80 44 L82 98 L86 30 C86 20 100 20 100 30 L100 96 L106 36 C106 26 120 26 120 36 L118 100 L128 54 C130 44 144 46 142 56 L136 122 C134 152 128 166 126 182 Z"/>
    <rect class="sweep" x="20" y="22" width="160" height="40"/>
   </svg>
  </div>

  <div id="topbar">
   <div class="brand"><i></i>HandClean Station</div>
   <ol id="steps">
    <li><b>1</b>สอดมือ</li><li><b>2</b>สแกน</li><li><b>3</b>พลิกมือ</li><li><b>4</b>สแกนอีกด้าน</li><li><b>5</b>ผลตรวจ</li>
   </ol>
   <div id="mode">วิธีใช้งาน</div>
  </div>

  <div id="cta"><strong>สอดมือเข้าไปในเครื่องเพื่อเริ่มตรวจ</strong><p>เครื่องจะเริ่มสแกนให้อัตโนมัติ</p></div>

  <div id="live-ui" role="status" aria-live="polite">
   <p id="instruction"></p><p id="sub"></p><div id="meter"><i></i></div>
  </div>
  <div id="warn">วางมือไว้ในเครื่อง</div>

  <section id="result" role="status" aria-live="assertive">
   <div class="icon">✓</div><h2>สะอาด</h2><p></p><small></small>
  </section>
  <div id="hint"></div>
 </div>
</main>
<script>
/* ===== Config ===== */
const params=new URLSearchParams(location.search);
const CONFIG={
 tutorialSrc:'media/tutorial-60s.mp4',      // the 60 s tutorial loop
 fallbackSrc:'media/idle-premium.mp4',      // used until the tutorial file exists
 liveFeedUrl:params.get('feed')||'',        // optional MJPEG stream from the inner camera
 demo:params.has('demo'),                   // force the built-in simulator
 debounceMs:500,                            // hand must stay in view this long before starting
 warnAfterMs:1000,                          // hand gone this long during a scan → show warning
 abortAfterMs:5000,                         // hand gone this long → back to Home
 resultMs:8000,                             // how long the result stays on screen
 heartbeatMs:3000,                          // no AI message for this long → treat AI as offline
 // Which step is lit while the tutorial plays, in seconds of a 60 s video (scaled to the real length).
 chapters:[[0,6,-1],[6,14,0],[14,22,1],[22,30,2],[30,38,3],[38,54,4],[54,60,-1]],
};

/* ===== Elements ===== */
const $=id=>document.getElementById(id);
const stage=$('stage'),tutorial=$('tutorial'),steps=[...$('steps').children],mode=$('mode');
const instruction=$('instruction'),sub=$('sub'),meter=$('meter').firstElementChild,warn=$('warn'),result=$('result'),hint=$('hint');

/* ===== Tutorial video (Home) ===== */
tutorial.src=CONFIG.tutorialSrc;
tutorial.addEventListener('error',()=>{if(!tutorial.src.endsWith(CONFIG.fallbackSrc)){tutorial.src=CONFIG.fallbackSrc;tutorial.play().catch(()=>{});}},{capture:true});
tutorial.play().catch(()=>{});
if(CONFIG.liveFeedUrl){$('feed').src=CONFIG.liveFeedUrl;$('feed').hidden=false;}

function lightSteps(active){steps.forEach((li,i)=>{li.classList.toggle('active',i===active);li.classList.toggle('done',active>=0&&i<active);});}
function tutorialStep(){
 const d=tutorial.duration;if(!Number.isFinite(d)||d<=0)return -1;
 const t=tutorial.currentTime/d*60;
 const ch=CONFIG.chapters.find(([a,b])=>t>=a&&t<b);return ch?ch[2]:-1;
}

/* ===== State machine ===== */
// home → detecting → scan1 → flip → scan2 → analyzing → result → home
const STEP_OF={detecting:0,scan1:1,flip:2,scan2:3,analyzing:3,result:4};
const TEXT={
 detecting:['ตรวจพบมือแล้ว','วางมือนิ่งๆ ไว้ในเครื่อง'],
 scan1:['กำลังสแกน…','วางมือนิ่งๆ'],
 flip:['พลิกมือ','พลิกให้เห็นมืออีกด้าน'],
 scan2:['กำลังสแกนอีกด้าน…','วางมือนิ่งๆ'],
 analyzing:['AI กำลังวิเคราะห์…','อีกสักครู่'],
};
let state='home',handPresent=false,handSince=0,handLostAt=0,armed=true,resultTimer=0,lastAI=-Infinity;

function setState(next){
 if(state===next)return;
 state=next;stage.dataset.state=next;
 if(next==='home'){
  lightSteps(tutorialStep());mode.textContent='วิธีใช้งาน';mode.classList.remove('live');
  stage.dataset.side='1';meter.style.width='0';warn.classList.remove('show');
  if(tutorial.currentTime>0.05)tutorial.currentTime=0;tutorial.play().catch(()=>{}); // always restart from 0:00
  armed=!handPresent;                                      // next person must take hands out first
  return;
 }
 if(next!=='detecting'&&!tutorial.paused){tutorial.pause();tutorial.currentTime=0;} // keep the element, pre-rewound, so Home resumes instantly
 mode.textContent='กำลังตรวจ';mode.classList.add('live');
 lightSteps(STEP_OF[next]);
 if(TEXT[next]){instruction.textContent=TEXT[next][0];sub.textContent=TEXT[next][1];}
 if(next==='scan1'||next==='scan2')meter.style.width='0';
 if(next==='flip')stage.dataset.side='2';
 if(next==='analyzing')meter.style.width='100%';
}

function showResult({clean,score,detail}){
 if(state==='home')return;
 result.classList.toggle('dirty',!clean);
 result.querySelector('.icon').textContent=clean?'✓':'!';
 result.querySelector('h2').textContent=clean?'สะอาด':'ไม่สะอาด';
 result.querySelector('p').textContent=detail||(clean?'มือของคุณสะอาดแล้ว':'ล้างมือใหม่ แล้วสแกนอีกครั้ง');
 result.querySelector('small').textContent=Number.isFinite(score)?`ความสะอาด ${Math.round(score)}%`:'';
 setState('result');
 clearTimeout(resultTimer);resultTimer=setTimeout(()=>setState('home'),CONFIG.resultMs);
}

/* ===== Events from the AI (or the simulator) ===== */
function handle(ev){
 if(!ev||typeof ev!=='object')return;
 if(!ev.sim)lastAI=performance.now();
 switch(ev.type){
  case 'hand':{
   const p=!!ev.present;
   if(p&&!handPresent)handSince=performance.now();
   if(!p&&handPresent)handLostAt=performance.now();
   handPresent=p;if(!p)armed=true;break;}
  case 'phase':if(state!=='home'&&state!=='result'&&TEXT[ev.phase])setState(ev.phase);break;
  case 'progress':if(state==='scan1'||state==='scan2')meter.style.width=Math.max(0,Math.min(1,+ev.value||0))*100+'%';break;
  case 'result':showResult(ev);break;
 }
}

/* Runs every 50 ms: debounce, hand-removed watchdog, tutorial step sync */
function tick(){
 const now=performance.now();
 if(state==='home'){
  lightSteps(tutorialStep());
  if(handPresent&&armed)setState('detecting');
 }else if(state==='detecting'){
  if(!handPresent)setState('home');
  else if(now-handSince>=CONFIG.debounceMs){setState('scan1');if(simulating())sim.run();}
 }else if(state!=='result'){
  const gone=!handPresent?now-handLostAt:0;
  warn.classList.toggle('show',gone>CONFIG.warnAfterMs&&state!=='flip');
  if(gone>CONFIG.abortAfterMs){sim.stop();setState('home');}
 }
}
setInterval(tick,50);   // timer, not rAF: keeps running even when the page isn't painting

/* ===== Connection to the AI backend (server.js relays POST /api/event → SSE) ===== */
if(location.protocol.startsWith('http')&&!CONFIG.demo){
 const es=new EventSource('events');
 es.onmessage=m=>{try{handle(JSON.parse(m.data));}catch{}};
}
const simulating=()=>CONFIG.demo||performance.now()-lastAI>CONFIG.heartbeatMs;

/* ===== Simulator: tap the screen, or use the keyboard, when no AI is connected ===== */
const sim={timers:[],nextClean:null,
 at(ms,ev){this.timers.push(setTimeout(()=>handle({...ev,sim:true}),ms));},
 stop(){this.timers.forEach(clearTimeout);this.timers=[];},
 progress(start,dur){for(let i=1;i<=10;i++)this.at(start+dur*i/10,{type:'progress',value:i/10});},
 run(){
  this.stop();
  this.progress(0,3500);this.at(3700,{type:'phase',phase:'flip'});
  this.at(6200,{type:'phase',phase:'scan2'});this.progress(6200,3500);
  this.at(9900,{type:'phase',phase:'analyzing'});
  const clean=this.nextClean??Math.random()>.35;this.nextClean=null;
  this.at(11200,{type:'result',clean,score:clean?96:62});
  this.at(11800,{type:'hand',present:false});
 },
};
stage.addEventListener('pointerdown',()=>{
 if(!simulating())return;
 if(state==='home'){armed=true;handle({type:'hand',present:true,sim:true});}
 else if(state==='result'){clearTimeout(resultTimer);setState('home');}
});
addEventListener('keydown',e=>{
 if(!simulating())return;
 const k=e.key.toLowerCase();
 if(k==='h')handle({type:'hand',present:!handPresent,sim:true});
 if(k==='c'||k==='u')sim.nextClean=k==='c';
 if(k==='r'){sim.stop();clearTimeout(resultTimer);handle({type:'hand',present:false,sim:true});setState('home');}
});
setInterval(()=>{hint.textContent=simulating()?'โหมดจำลอง · แตะจอ = สอดมือ · H มือเข้า/ออก · C/U ผลสะอาด/ไม่สะอาด · R รีเซ็ต':'';},1000);
</script>
</body>
</html>
